name: CI - Identity service

# Mismo patrón que ci-campaign-service.yml. Dos diferencias, a revisar con DevOps:
#  1. También corre en PR hacia "development": con GitFlow las historias se
#     fusionan ahí, no en main; si solo corre hacia main, una historia nunca
#     pasa por la integración continua antes de fusionarse.
#  2. Ejecuta "dotnet test": sin ese paso, T-304.5, T-330.5 y T-303.3 existen
#     pero nadie las corre automáticamente.
on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "development"]

jobs:
  compilar-dotnet:
    name: Compilar y probar ASP.NET Core 10
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar el proyecto
        run: dotnet build

      - name: Ejecutar pruebas
        run: dotnet test --no-build --verbosity normal
