name: CI - Identity service

# Corre en los PR hacia develop y main: con GitFlow las historias se integran
# en develop, y ahí es donde deben compilar y pasar las pruebas (T-304.5,
# T-330.5 y T-303.3) antes de fusionarse.
on:
  workflow_dispatch:
  pull_request:
    branches: ["main", "develop"]

jobs:
  compilar-dotnet:
    name: Compilar y probar ASP.NET Core 10
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compilar el proyecto
        run: dotnet build

      - name: Ejecutar pruebas
        run: dotnet test --no-build --verbosity normal
